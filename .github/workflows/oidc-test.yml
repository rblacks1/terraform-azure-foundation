name: oidc-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check variables are visible
        run: |
          echo "client id length: ${#CLIENT_ID}"
          echo "tenant id length: ${#TENANT_ID}"
          echo "subscription id length: ${#SUB_ID}"
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUB_ID:    ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prove it
        run: |
          az account show
          az group list -o table
